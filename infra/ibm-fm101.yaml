
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: fm101-postgres
  namespace: crossplane-system
  labels:
    network-code: cn580004
    team: platform
    managed-by: backstage
    environment: fm101
spec:
  forProvider:
    source: Inline
    module: |
      terraform {
        required_providers {
          ibm = { source = "IBM-Cloud/ibm" }
        }
      }
      variable "ibmcloud_api_key" {}
      variable "region" {}
      provider "ibm" {
        ibmcloud_api_key = var.ibmcloud_api_key
        region           = var.region
      }
      resource "ibm_database" "postgres" {
        name              = "fm101-postgres"
        service           = "databases-for-postgresql"
        plan              = "standard"
        location          = "us-south"
        adminpassword     = "Admin12345!"
        members_memory_allocation_mb = 1024
        members_disk_allocation_mb   = 20480
      }
      output "hostname" { value = ibm_database.postgres.connectionstrings[0].hosts[0].hostname }
      output "port"     { value = ibm_database.postgres.connectionstrings[0].hosts[0].port }
  providerConfigRef:
    name: ibm-cloud
---
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: fm101-cos
  namespace: crossplane-system
  labels:
    network-code: cn580004
    team: platform
    managed-by: backstage
    environment: fm101
spec:
  forProvider:
    source: Inline
    module: |
      terraform {
        required_providers {
          ibm = { source = "IBM-Cloud/ibm" }
        }
      }
      variable "ibmcloud_api_key" {}
      variable "region" {}
      provider "ibm" {
        ibmcloud_api_key = var.ibmcloud_api_key
        region           = var.region
      }
      resource "ibm_resource_instance" "cos" {
        name     = "fm101-cos"
        service  = "cloud-object-storage"
        plan     = "standard"
        location = "global"
      }
      resource "ibm_cos_bucket" "bucket" {
        bucket_name          = "fm101-cn580004-data"
        resource_instance_id = ibm_resource_instance.cos.id
        region_location      = "us-south"
        storage_class        = "standard"
      }
      output "bucket_name" { value = ibm_cos_bucket.bucket.bucket_name }
  providerConfigRef:
    name: ibm-cloud
---
