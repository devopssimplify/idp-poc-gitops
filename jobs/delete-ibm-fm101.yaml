apiVersion: batch/v1
kind: Job
metadata:
  name: fm101-delete-ibm
  namespace: idp
  labels:
    managed-by: backstage
    action: delete
    environment: fm101
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: ibm-cli
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            apk add --no-cache curl bash ca-certificates git

            echo "=== Installing IBM Cloud CLI ==="
            curl -fsSL https://clis.cloud.ibm.com/install/linux | bash

            echo "=== Logging in to IBM Cloud ==="
            ibmcloud login --apikey "${IBM_API_KEY}" -r us-south -q
            ibmcloud target -g Default

            delete_instance() {
              echo "Deleting IBM Cloud service: $1"
              ibmcloud resource service-instance-delete "$1" \
                --force --recursive 2>/dev/null && \
                echo "Deleted: $1" || \
                echo "Not found or already deleted: $1"
            }

            echo "=== Removing manifests from idp-poc-gitops ==="
            git config --global user.email "backstage@devopssimplify.com"
            git config --global user.name "Backstage Scaffolder"

            git clone "https://${GITHUB_TOKEN}@github.com/devopssimplify/idp-poc-gitops.git" /tmp/gitops
            cd /tmp/gitops

            CHANGED=0

            # Remove namespace manifest
            if [ -f "cluster/namespace-fm101.yaml" ]; then
              git rm "cluster/namespace-fm101.yaml"
              CHANGED=1
              echo "Removed cluster/namespace-fm101.yaml"
            fi

            # Remove infra manifest
            if [ -f "infra/ibm-fm101.yaml" ]; then
              git rm "infra/ibm-fm101.yaml"
              CHANGED=1
              echo "Removed infra/ibm-fm101.yaml"
            fi

            # Remove all app deployments for this namespace (apps/<env>/*.yaml)
            if [ -d "apps/fm101" ]; then
              git rm -r "apps/fm101/"
              CHANGED=1
              echo "Removed apps/fm101/ (all deployments)"
            fi

            # Remove any provisioning jobs for this env
            if [ -d "jobs" ]; then
              for f in jobs/*-fm101.yaml jobs/*-fm101-*.yaml; do
                [ -f "$f" ] && git rm "$f" && echo "Removed $f" && CHANGED=1
              done
            fi

            if [ "$CHANGED" = "1" ]; then
              git commit -m "chore: remove fm101 environment (deleted via Backstage)"
              git push origin main
              echo "Manifests removed from idp-poc-gitops — ArgoCD will prune the namespace"
            else
              echo "No manifests found in idp-poc-gitops for fm101"
            fi

            echo "=== Deletion complete for: fm101 ==="
        env:
        - name: IBM_API_KEY
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: IBM_API_KEY
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: GITHUB_TOKEN
