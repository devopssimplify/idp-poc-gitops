apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnds-ui
  namespace: cnds-500
  labels:
    app: cnds-ui
    team: platform
    network-code: CN580004
    version: "v1.0"
    managed-by: backstage
  annotations:
    description: "Deployment for cnds-ui version v1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cnds-ui
  template:
    metadata:
      labels:
        app: cnds-ui
        team: platform
        network-code: CN580004
        version: "v1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cnds-ui
        image: us-central1-docker.pkg.dev/project-7d27fad9-61bb-42c4-b2e/backstage/hello-app:1.0
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: [ALL]
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: APP_VERSION
          value: "v1.0"
        - name: ENVIRONMENT
          value: "cnds-500"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
