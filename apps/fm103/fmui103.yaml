apiVersion: apps/v1
kind: Deployment
metadata:
  name: fmui103
  namespace: fm103
  labels:
    app: fmui103
    team: platform
    network-code: cn580005
    managed-by: backstage
    cloud: ibm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fmui103
  template:
    metadata:
      labels:
        app: fmui103
        team: platform
    spec:
      containers:
      - name: fmui103
        image: nginx:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fmui103
  namespace: fm103
  labels:
    app: fmui103
    managed-by: backstage
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: fmui103
