apiVersion: apps/v1
kind: Deployment
metadata:
  name: fmui
  namespace: fm101
  labels:
    app: fmui
    team: platform
    network-code: cn580004
    managed-by: backstage
    cloud: ibm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fmui
  template:
    metadata:
      labels:
        app: fmui
        team: platform
    spec:
      imagePullSecrets:
        - name: icr-secret
      containers:
      - name: fmui
        image: nginx:alpine
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fmui
  namespace: fm101
  labels:
    app: fmui
    managed-by: backstage
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: fmui
